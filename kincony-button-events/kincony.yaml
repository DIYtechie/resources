###############################################################################
# Button Scripts (Long press + Finalize clicks for inputs 1–16)
###############################################################################
script:
  # --- Long-press timers (fire button_X_long while held) ---
  - id: btn1_long_timer
    mode: restart
    then:
      - delay: ${long_min}
      - if:
          condition:
            lambda: 'return id(btn1_is_down) && !id(btn1_long_fired);'
          then:
            - lambda: |-
                id(btn1_long_fired) = true;
                id(btn1_click_count) = 0;
            - homeassistant.event:
                event: "esphome.button_action"
                data: { device: "${kc_device}", input: "1", action: "button_1_long" }

  - id: btn2_long_timer
