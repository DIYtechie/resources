###############################################################################
# Click finalization scripts (inputs 1–16)
# - Fires "button_X_single", "button_X_double" or "button_X_triple"
# - Only triggers if no long press fired
###############################################################################

  # --- Finalize clicks for input 1 ---
  - id: btn1_finalize_clicks
    mode: restart
    then:
      - delay: ${mp_gap}
      - if:
          condition:
            lambda: 'return !id(btn1_is_down) && !id(btn1_long_fired) && id(btn1_click_count) > 0;'
          then:
            - if:
                condition:
                  lambda: 'return id(btn1_click_count) == 1;'
                then:
                  - homeassistant.event:
                      event: "esphome.button_action"
                      data: { device: "${kc_device}", input: "1", action: "button_1_single" }
                else:
                  - if:
                      condition:
                        lambda: 'return id(btn1_click_count) == 2;'
                      then:
                        - homeassistant.event:
                            event: "esphome.button_action"
                            data: { device: "${kc_device}", input: "1", action: "button_1_double" }
                      else:
                        - homeassistant.event:
                            event: "esphome.button_action"
                            data: { device: "${kc_device}", input: "1", action: "button_1_triple" }
      - lambda: 'id(btn1_click_count) = 0;'

