# Public sharing version. See README.md for timing and known limitations.
###############################################################################
# Device & platform
###############################################################################
esphome:
  name: kincony-kc868-a16
  comment: "KC868-A16 with 16 inputs (multi-press on-device); example outputs 1 and 9"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

###############################################################################
# Global substitutions (tuning knobs you can adjust in one place)
###############################################################################
substitutions:
  kc_device: "kc868_a16"

  # Multi-press timing:
  mp_gap: "400ms"       # max OFF pause between clicks (defines single vs double vs triple)
  long_min: "1500ms"    # hold time to trigger long press (fires while holding)
  debounce_ms: "0ms"    # increase to 10ms if you see switch bounce

###############################################################################
# Network (LAN8720). New 'clk' syntax avoids deprecation warning.
###############################################################################
ethernet:
  type: LAN8720
  mdc_pin: GPIO23
  mdio_pin: GPIO18
  clk:                # replaces old 'clk_mode: GPIO17_OUT'
    pin: GPIO17
    mode: CLK_OUT
  phy_addr: 0

  # DHCP: configure a reservation on your router if needed.

###############################################################################
# OTA + API + Logging
###############################################################################
ota:
  - platform: esphome
    password: !secret ota_password

api:
  encryption:
    key: !secret api_encryption_key
logger: {}       # Enable logs

###############################################################################
# I²C bus (note: GPIO5 is a strapping pin; avoid heavy external pulls)
###############################################################################
i2c:
  sda: 4
  scl: 5
  frequency: 400kHz
  scan: true
  id: bus_a

###############################################################################
# PCF8574 expanders (two for outputs, two for inputs)
###############################################################################
pcf8574:
  - id: pcf8574_hub_out_1   # outputs 1-8
    address: 0x24

  - id: pcf8574_hub_out_2   # outputs 9-16
    address: 0x25

  - id: pcf8574_hub_in_1    # inputs 1-8
    address: 0x21

  - id: pcf8574_hub_in_2    # inputs 9-16
    address: 0x22

###############################################################################
# Example outputs (you can add more following the same pattern)
###############################################################################
switch:
  - platform: gpio
    name: "KinCony output 1"
    pin:
      pcf8574: pcf8574_hub_out_1
      number: 0
      mode: OUTPUT
      inverted: false

  - platform: gpio
    name: "KinCony output 9"
    pin:
      pcf8574: pcf8574_hub_out_2
      number: 0
      mode: OUTPUT
      inverted: false

