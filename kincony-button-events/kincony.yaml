###############################################################################
# Binary Sensors (Inputs 1–16)
# Emits: button_X_pressed / button_X_released / button_X_single / double / triple / long
###############################################################################
binary_sensor:
  # --- Inputs 1–8 on first PCF8574 hub ---
  - platform: gpio
    name: "KinCony input 1"
    pin:
      pcf8574: pcf8574_hub_in_1
      number: 0
      mode: INPUT
      inverted: true
    filters:
      - delayed_on: ${debounce_ms}
      - delayed_off: ${debounce_ms}
    on_press:
      then:
        - lambda: 'id(btn1_is_down) = true;'
        - homeassistant.event:
            event: "esphome.button_action"
            data: { device: "${kc_device}", input: "1", action: "button_1_pressed" }
        - script.execute: btn1_long_timer
    on_release:
      then:
        - lambda: 'id(btn1_is_down) = false;'
        - homeassistant.event:
            event: "esphome.button_action"
            data: { device: "${kc_device}", input: "1", action: "button_1_released" }
        - if:
            condition:
              lambda: 'return id(btn1_long_fired);'
            then:
              - lambda: |-
                  id(btn1_long_fired) = false;
                  id(btn1_click_count) = 0;
            else:
              - lambda: |-
                  if (id(btn1_click_count) < 3) id(btn1_click_count) += 1;
              - script.execute: btn1_finalize_clicks

